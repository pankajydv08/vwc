<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holi Wishes | Charmi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f4f2;
            --pink: #ff0080;
            --yellow: #ffde00;
            --cyan: #00e5ff;
            --purple: #7a00ff;
            --black: #121212;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* TACTILE GRAIN FILTER */
        .noise-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.12;
            mix-blend-mode: multiply;
        }

        .stage {
            position: relative;
            width: 90vw;
            max-width: 1000px;
            height: 80vh;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
        }

        /* CHROMATIC OVERLAY LAYERS */
        .chroma-shape {
            position: absolute;
            filter: blur(40px);
            mix-blend-mode: multiply;
            opacity: 0;
            transform: scale(0.8);
            animation: layer-entry 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .shape-1 {
            width: 400px; height: 400px;
            background: var(--pink);
            top: 10%; left: 10%;
            animation-delay: 0.1s;
        }

        .shape-2 {
            width: 350px; height: 350px;
            background: var(--yellow);
            bottom: 10%; right: 15%;
            animation-delay: 0.3s;
        }

        .shape-3 {
            width: 300px; height: 300px;
            background: var(--cyan);
            top: 30%; right: 5%;
            animation-delay: 0.5s;
        }

        /* TYPOGRAPHY HIERARCHY */
        .main-title {
            grid-column: 1 / 10;
            grid-row: 3 / 7;
            font-size: clamp(5rem, 15vw, 12rem);
            line-height: 0.85;
            color: var(--black);
            z-index: 10;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            mix-blend-mode: darken;
        }

        .recipient {
            grid-column: 7 / 13;
            grid-row: 7 / 9;
            font-size: clamp(3rem, 10vw, 8rem);
            color: var(--pink);
            z-index: 11;
            text-align: right;
            transform: translateY(-20px);
            font-style: italic;
        }

        .wish-block {
            grid-column: 2 / 6;
            grid-row: 9 / 12;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--black);
            text-transform: uppercase;
            padding-top: 2rem;
            border-top: 1px solid rgba(0,0,0,0.1);
            z-index: 20;
        }

        .meta-data {
            grid-column: 10 / 13;
            grid-row: 2 / 3;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-align: right;
            letter-spacing: 0.1em;
            opacity: 0.6;
        }

        /* INTERACTIVE ELEMENTS */
        .btn-interact {
            position: absolute;
            bottom: 5%;
            right: 5%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1px solid var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
            z-index: 50;
        }

        .btn-interact:hover {
            background: var(--black);
            transform: scale(1.1) rotate(90deg);
        }

        .btn-interact:hover svg {
            stroke: white;
        }

        /* ANIMATIONS */
        @keyframes layer-entry {
            to {
                opacity: 0.6;
                transform: scale(1);
            }
        }

        .char-reveal span {
            display: inline-block;
            opacity: 0;
            transform: translateY(30px);
            animation: char-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes char-up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CURSOR TRAIL EFFECT (TACTILE SHIFT) */
        .overlay-wrap {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 0.2s ease-out;
        }

    </style>
</head>
<body>

    <svg class="noise-canvas">
        <filter id='noiseFilter'>
            <feTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/>
        </filter>
        <rect width='100%' height='100%' filter='url(#noiseFilter)'/>
    </svg>

    <div class="stage" id="stage">
        <div class="overlay-wrap" id="overlayWrap">
            <div class="chroma-shape shape-1"></div>
            <div class="chroma-shape shape-2"></div>
            <div class="chroma-shape shape-3"></div>
        </div>

        <div class="meta-data">
            FESTIVAL OF COLORS<br>SPRING MMXXIV
        </div>

        <h1 class="main-title char-reveal" id="titleHoli">
            <span>HAPPY</span><br><span>HOLI</span>
        </h1>

        <div class="recipient char-reveal">
            <span style="animation-delay: 0.5s;">CHARMI</span>
        </div>

        <div class="wish-block">
            <p>May your life be as tactile and vibrant as the colors of Gulal. Wishing you a chromatic spectrum of joy, health, and infinite creative energy.</p>
        </div>

        <button class="btn-interact" onclick="shuffleColors()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
        </button>
    </div>

    <script>
        // Staggered text animation
        const spans = document.querySelectorAll('.char-reveal span');
        spans.forEach((span, i) => {
            span.style.animationDelay = `${0.2 + (i * 0.1)}s`;
        });

        // Tactile mouse movement
        const stage = document.getElementById('stage');
        const overlay = document.getElementById('overlayWrap');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            overlay.style.transform = `translateX(${x}px) translateY(${y}px)`;
        });

        // Color shuffle interaction
        function shuffleColors() {
            const colors = ['#ff0080', '#ffde00', '#00e5ff', '#7a00ff', '#ff5722', '#4caf50'];
            const shapes = document.querySelectorAll('.chroma-shape');
            shapes.forEach(shape => {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                shape.style.background = randomColor;
                shape.style.transform = `scale(${0.8 + Math.random()}) translate(${Math.random()*50}px, ${Math.random()*50}px)`;
            });
        }
    </script>
</body>
</html>
